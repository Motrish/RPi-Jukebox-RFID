name: Test Build Web App v3

on:
  schedule:
    # run at 18:00 every sunday
    - cron: '0 18 * * 0'
  push:
    branches:
        - 'future3/**'
    paths:
        - '.github/workflows/test_build_webapp_v3.yml'
        - '.github/actions/build-webapp/**'
        - 'src/webapp/**'
        - 'tests/design-preview/**'
  pull_request:
    # The branches below must be a subset of the branches above
    branches:
        - future3/develop
        - future3/main
    paths:
        - '.github/workflows/test_build_webapp_v3.yml'
        - '.github/actions/build-webapp/**'
        - 'src/webapp/**'
        - 'tests/design-preview/**'

jobs:

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Build Web App
        uses: ./.github/actions/build-webapp

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Playwright test tool
        run: python -m pip install playwright==1.64.0

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - name: Test built React preview in Chromium
        timeout-minutes: 3
        run: >-
          python -u tests/design-preview/react_smoke.py
          --serve-directory src/webapp/build
          --output-dir "${{ runner.temp }}/design-preview-react"
          --emit-preview-png-base64

      - name: Upload browser screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: design-preview-react-browser-check
          path: ${{ runner.temp }}/design-preview-react/
          if-no-files-found: ignore
          retention-days: 7
