# Opt-in MPD 0.24.x policy for the Phoniebox local owner profile.
# Merge this into the effective MPD configuration. Store the owner password in
# a mode-0600 file owned by the daemon's effective UID and set credential_path
# to that file in jukebox.local-playback.example.yaml.
music_directory "/home/pi/RPi-Jukebox-RFID/shared/audiofolders"
playlist_directory "/var/lib/mpd/playlists"
db_file "/var/lib/mpd/tag_cache"
state_file "/var/lib/mpd/state"
sticker_file "/var/lib/mpd/sticker.sql"

bind_to_address "127.0.0.1"
port "6601"
default_permissions "read"
password "REPLACE_WITH_A_LONG_RANDOM_SECRET@read,add,control"

# Do not add host_permissions or local_permissions that grant write access.
# Validate the effective configuration and every TCP/Unix endpoint on the target
# MPD 0.24.x installation before enabling this profile.
