worker_processes 1;
pid logs/nginx.pid;
error_log logs/error.log warn;

events {
    worker_connections 64;
}

http {
    map $server_port $x01_backend_authority {
        default 127.0.0.1:@@X01_BACKEND_PORT@@;
    }

    map $request_uri $x01_api_target_allowed {
        default 0;
        /api/library/media 1;
        "~^/api/library/media[?]limit=(?:[1-9]|[1-9][0-9]|1[0-9]{2}|200)$" 1;
        "~^/api/library/media[?]limit=(?:[1-9]|[1-9][0-9]|1[0-9]{2}|200)&cursor=[A-Za-z0-9_-]{1,128}$" 1;
        "~^/api/library/media[?]cursor=[A-Za-z0-9_-]{1,128}$" 1;
        "~^/api/library/media[?]cursor=[A-Za-z0-9_-]{1,128}&limit=(?:[1-9]|[1-9][0-9]|1[0-9]{2}|200)$" 1;
        "~^/api/library/media/[A-Za-z0-9_-]{1,128}$" 1;
    }

    client_body_temp_path logs/client_body_temp 1 2;
    proxy_temp_path logs/proxy_temp 1 2;
    fastcgi_temp_path logs/fastcgi_temp 1 2;
    uwsgi_temp_path logs/uwsgi_temp 1 2;
    scgi_temp_path logs/scgi_temp 1 2;
    client_body_timeout 5s;
    client_header_timeout 5s;
    client_max_body_size 1k;
    client_body_buffer_size 1k;
    client_header_buffer_size 1k;
    large_client_header_buffers 4 4k;
    send_timeout 5s;
    keepalive_timeout 5s;
    server_tokens off;

    server {
        listen 127.0.0.1:@@X01_LISTEN_PORT@@ default_server;
        server_name 127.0.0.1;

        root @@X01_BUILD_ROOT@@;
        index index.html;
        autoindex off;
        disable_symlinks on;
        access_log off;
        default_type text/plain;

        types {
            text/html html;
            text/css css;
            application/javascript js;
            application/json json;
            application/manifest+json webmanifest;
            image/gif gif;
            image/jpeg jpeg jpg;
            image/png png;
            image/svg+xml svg;
            image/x-icon ico;
            font/woff woff;
            font/woff2 woff2;
        }

        set $x01_origin_route invalid;
        if ($http_host != "127.0.0.1:$server_port") {
            return 400 "Bad Request";
        }
        if ($request ~* "^[A-Z]+[[:space:]]+[A-Z][A-Z0-9+.-]*://") {
            return 400 "Bad Request";
        }
        if ($request_method != GET) {
            return 405 "Method Not Allowed";
        }
        if ($http_origin = "") {
            set $x01_origin_route empty;
        }
        if ($http_origin ~ "^[[:space:]]+$") {
            set $x01_origin_route empty;
        }
        if ($http_origin = "http://127.0.0.1:$server_port") {
            set $x01_origin_route valid;
        }
        if ($x01_origin_route = invalid) {
            return 400 "Bad Request";
        }

        error_page 418 = @x01_proxy_with_origin;
        error_page 419 = @x01_proxy_empty_origin;

        location = /api/library/media {
            if ($x01_api_target_allowed = 0) {
                return 400 "Bad Request";
            }
            if ($x01_origin_route = valid) {
                return 418;
            }
            return 419;
        }

        location ^~ /api/library/media/ {
            if ($x01_api_target_allowed = 0) {
                return 400 "Bad Request";
            }
            if ($x01_origin_route = valid) {
                return 418;
            }
            return 419;
        }

        location ^~ /api/ {
            return 404 "Not Found";
        }

        location = / {
            if ($request_uri != $uri) {
                return 400 "Bad Request";
            }
            try_files /index.html =404;
        }

        location = /index.html {
            if ($request_uri != $uri) {
                return 400 "Bad Request";
            }
            try_files $uri =404;
        }

        location = /favicon.ico {
            if ($request_uri != $uri) {
                return 400 "Bad Request";
            }
            try_files $uri =404;
        }

        location = /logo192.png {
            if ($request_uri != $uri) {
                return 400 "Bad Request";
            }
            try_files $uri =404;
        }

        location = /manifest.json {
            if ($request_uri != $uri) {
                return 400 "Bad Request";
            }
            try_files $uri =404;
        }

        location = /locales/de/translation.json {
            if ($request_uri != $uri) {
                return 400 "Bad Request";
            }
            try_files $uri =404;
        }

        location = /locales/en/translation.json {
            if ($request_uri != $uri) {
                return 400 "Bad Request";
            }
            try_files $uri =404;
        }

        location ^~ /static/ {
            if ($request_uri != $uri) {
                return 400 "Bad Request";
            }
            try_files $uri =404;
        }

        location / {
            return 404 "Not Found";
        }

        location @x01_proxy_with_origin {
            proxy_http_version 1.0;
            proxy_set_header Host $x01_backend_authority;
            proxy_set_header Connection close;
            proxy_set_header Origin http://$x01_backend_authority;
            proxy_connect_timeout 2s;
            proxy_send_timeout 3s;
            proxy_read_timeout 3s;
            proxy_buffering off;
            proxy_cache off;
            proxy_next_upstream off;
            proxy_pass_request_headers on;
            proxy_pass_request_body on;
            proxy_pass http://$x01_backend_authority;
        }

        location @x01_proxy_empty_origin {
            proxy_http_version 1.0;
            proxy_set_header Host $x01_backend_authority;
            proxy_set_header Connection close;
            proxy_connect_timeout 2s;
            proxy_send_timeout 3s;
            proxy_read_timeout 3s;
            proxy_buffering off;
            proxy_cache off;
            proxy_next_upstream off;
            proxy_pass_request_headers on;
            proxy_pass_request_body on;
            proxy_pass http://$x01_backend_authority;
        }
    }
}
