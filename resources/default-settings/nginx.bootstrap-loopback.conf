worker_processes 1;
pid logs/nginx.pid;
error_log logs/error.log warn;

events {
    worker_connections 64;
}

http {
    map $server_port $bootstrap_backend_authority {
        default 127.0.0.1:@@BOOTSTRAP_UPSTREAM_PORT@@;
    }

    client_body_temp_path logs/client_body_temp 1 2;
    proxy_temp_path logs/proxy_temp 1 2;
    fastcgi_temp_path logs/fastcgi_temp 1 2;
    uwsgi_temp_path logs/uwsgi_temp 1 2;
    scgi_temp_path logs/scgi_temp 1 2;
    client_body_timeout 5s;
    client_header_timeout 5s;
    client_max_body_size 1k;
    client_body_buffer_size 1k;
    client_header_buffer_size 1k;
    large_client_header_buffers 4 4k;
    send_timeout 5s;
    keepalive_timeout 5s;
    server_tokens off;

    server {
        listen 127.0.0.1:@@BOOTSTRAP_LISTEN_PORT@@ default_server;
        server_name 127.0.0.1;

        root @@BOOTSTRAP_WEBROOT@@;
        index index.html;
        autoindex off;
        disable_symlinks on;
        access_log off;
        default_type text/plain;

        types {
            text/html html;
            text/css css;
            application/javascript js;
            application/json json;
            application/manifest+json webmanifest;
            image/gif gif;
            image/jpeg jpeg jpg;
            image/png png;
            image/svg+xml svg;
            image/x-icon ico;
            font/woff woff;
            font/woff2 woff2;
        }

        set $bootstrap_origin_route invalid;
        if ($http_host != "127.0.0.1:$server_port") {
            return 400 "Bad Request";
        }
        if ($request ~* "^[A-Z]+[[:space:]]+[A-Z][A-Z0-9+.-]*://") {
            return 400 "Bad Request";
        }
        if ($request_method != GET) {
            return 405 "Method Not Allowed";
        }
        if ($http_origin = "") {
            set $bootstrap_origin_route empty;
        }
        if ($http_origin ~ "^[[:space:]]+$") {
            set $bootstrap_origin_route empty;
        }
        if ($http_origin ~ ",") {
            return 400 "Bad Request";
        }
        if ($http_origin = "http://127.0.0.1:$server_port") {
            set $bootstrap_origin_route valid;
        }
        if ($bootstrap_origin_route = invalid) {
            return 400 "Bad Request";
        }

        error_page 418 = @bootstrap_proxy_with_origin;
        error_page 419 = @bootstrap_proxy_empty_origin;

        location = /setup/ {
            if ($request_uri != $uri) {
                return 400 "Bad Request";
            }
            if ($http_x_i01b_readiness = "@@BOOTSTRAP_READY_TOKEN@@") {
                return 204;
            }
            set $bootstrap_proxy_target /;
            if ($bootstrap_origin_route = valid) {
                return 418;
            }
            return 419;
        }

        location = /api/preflight {
            if ($request_uri != $uri) {
                return 400 "Bad Request";
            }
            set $bootstrap_proxy_target /api/preflight;
            if ($bootstrap_origin_route = valid) {
                return 418;
            }
            return 419;
        }

        location = / {
            if ($request_uri != $uri) {
                return 400 "Bad Request";
            }
            try_files /index.html =404;
        }

        location = /index.html {
            if ($request_uri != $uri) {
                return 400 "Bad Request";
            }
            try_files $uri =404;
        }

        location = /favicon.ico {
            if ($request_uri != $uri) {
                return 400 "Bad Request";
            }
            try_files $uri =404;
        }

        location = /logo192.png {
            if ($request_uri != $uri) {
                return 400 "Bad Request";
            }
            try_files $uri =404;
        }

        location = /manifest.json {
            if ($request_uri != $uri) {
                return 400 "Bad Request";
            }
            try_files $uri =404;
        }

        location = /locales/de/translation.json {
            if ($request_uri != $uri) {
                return 400 "Bad Request";
            }
            try_files $uri =404;
        }

        location = /locales/en/translation.json {
            if ($request_uri != $uri) {
                return 400 "Bad Request";
            }
            try_files $uri =404;
        }

        location ^~ /static/ {
            if ($request_uri != $uri) {
                return 400 "Bad Request";
            }
            try_files $uri =404;
        }

        location ^~ /setup/ {
            return 404 "Not Found";
        }

        location ^~ /api/ {
            return 404 "Not Found";
        }

        location / {
            return 404 "Not Found";
        }

        location @bootstrap_proxy_with_origin {
            proxy_http_version 1.0;
            proxy_set_header Host $bootstrap_backend_authority;
            proxy_set_header Connection close;
            proxy_set_header Origin http://$bootstrap_backend_authority;
            proxy_set_header Authorization "";
            proxy_set_header Cookie "";
            proxy_connect_timeout 2s;
            proxy_send_timeout 3s;
            proxy_read_timeout 3s;
            proxy_buffering off;
            proxy_cache off;
            proxy_next_upstream off;
            proxy_pass_request_headers on;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_pass http://$bootstrap_backend_authority$bootstrap_proxy_target;
        }

        location @bootstrap_proxy_empty_origin {
            proxy_http_version 1.0;
            proxy_set_header Host $bootstrap_backend_authority;
            proxy_set_header Connection close;
            proxy_set_header Authorization "";
            proxy_set_header Cookie "";
            proxy_connect_timeout 2s;
            proxy_send_timeout 3s;
            proxy_read_timeout 3s;
            proxy_buffering off;
            proxy_cache off;
            proxy_next_upstream off;
            proxy_pass_request_headers on;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_pass http://$bootstrap_backend_authority$bootstrap_proxy_target;
        }
    }
}
